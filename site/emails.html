<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Cue — Email templates</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E7EAEF;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</helmet>

<div style="max-width:640px;margin:0 auto;padding:clamp(24px,5vw,48px) 16px 80px">
  <div style="text-align:center;margin-bottom:26px">
    <div style="font:500 11px 'DM Mono',monospace;letter-spacing:.14em;color:#5A6672">CUE · TRANSACTIONAL EMAIL TEMPLATES</div>
    <div style="font-size:13px;color:#8D99A5;margin-top:6px">Single column · 560px · light-friendly · one primary action each</div>
  </div>

  <sc-for list="{{ emails }}" as="e" hint-placeholder-count="4">
    <div style="margin-bottom:30px">
      <!-- label / subject bar -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 4px">
        <span style="font:500 10px 'DM Mono',monospace;letter-spacing:.08em;color:#8D99A5;background:#DADFE7;border-radius:6px;padding:4px 9px">{{ e.tag }}</span>
        <span style="font-size:13px;color:#43505F">Subject: <b style="color:#101828">{{ e.subject }}</b></span>
      </div>

      <!-- email body (560px) -->
      <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #E1E5EC;border-radius:14px;overflow:hidden;box-shadow:0 20px 44px -30px rgba(16,24,40,.4)">
        <div style="padding:34px 40px 8px">
          <div style="display:flex;align-items:center;gap:9px">
            <span style="width:30px;height:30px;border-radius:9px;background:#101828;display:flex;align-items:center;justify-content:center;position:relative"><span style="font-size:16px;font-weight:600;color:#fff">C</span><span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#3D6EE8;right:6px;bottom:8px"></span></span>
            <b style="font-size:19px;font-weight:500;letter-spacing:-.8px;color:#101828">cue<span style="color:#3D6EE8">.</span></b>
          </div>
        </div>
        <div style="padding:22px 40px 34px">
          <div style="font-size:21px;font-weight:600;letter-spacing:-.4px;color:#101828;line-height:1.25">{{ e.head }}</div>
          <p style="font-size:15px;line-height:1.7;color:#43505F;margin:16px 0 0">{{ e.body }}</p>
          <sc-if value="{{ e.hasBalance }}" hint-placeholder-val="{{ false }}">
            <div style="background:#F5F7FA;border:1px solid #E5E9F0;border-radius:11px;padding:14px 16px;margin-top:18px;display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;color:#5A6672">Credits remaining</span><b style="font-size:18px;color:#101828">{{ e.balance }}</b></div>
          </sc-if>
          <a href="{{ e.btnHref }}" style="display:block;text-align:center;background:#3D6EE8;color:#fff;border-radius:11px;padding:14px;font-size:15px;font-weight:600;text-decoration:none;margin-top:24px">{{ e.btn }}</a>
          <sc-if value="{{ e.hasPs }}" hint-placeholder-val="{{ false }}">
            <p style="font-size:13px;line-height:1.6;color:#8D99A5;margin:20px 0 0">{{ e.ps }}</p>
          </sc-if>
        </div>
        <div style="background:#FAFBFC;border-top:1px solid #EDF0F4;padding:18px 40px;font-size:11.5px;color:#98A2AF;line-height:1.6">
          © 2026 Cue · <a href="mailto:hello@justcue.ai" style="color:#5A6672;text-decoration:none">hello@justcue.ai</a><br>{{ e.legal }}
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  emails = [
    {
      tag: "01 · WELCOME", subject: "Your Cue is ready.",
      head: "Maya — your Cue is live.",
      body: "It's already private, already yours. This link signs you in on any device:",
      btn: "Open Cue", btnHref: "#magic-link",
      hasPs: true, ps: "Save this email — the link is your key. You can request a fresh one anytime at justcue.ai/signin.",
      legal: "You're receiving this because you set up a Cue account.",
    },
    {
      tag: "02 · SIGN-IN LINK", subject: "Your sign-in link",
      head: "Here's your sign-in link.",
      body: "Tap below to sign in to Cue on this device.",
      btn: "Sign in to Cue", btnHref: "#magic-link",
      hasPs: true, ps: "Valid for 15 minutes. If you didn't request this, you can safely ignore it.",
      legal: "This is a security email for your Cue account.",
    },
    {
      tag: "03 · CREDITS LOW", subject: "Running low on credits",
      head: "You're running low on credits.",
      body: "You've used most of this cycle's credits. Cue will check with you before starting big jobs. Top up anytime to keep things moving.",
      btn: "Top up", btnHref: "#account",
      hasBalance: true, balance: "1,180",
      legal: "You're receiving this because credit alerts are on for your account.",
    },
    {
      tag: "04 · PAYMENT FAILED", subject: "Payment issue — Cue keeps running for now",
      head: "We couldn't process your payment.",
      body: "No need to worry — Cue keeps running during a short grace period while we retry. Update your payment method to avoid any interruption.",
      btn: "Update payment method", btnHref: "#portal",
      legal: "You're receiving this because of a billing issue on your account.",
    },
  ];
  renderVals() {
    return {
      emails: this.emails.map(e => ({
        tag: e.tag, subject: e.subject, head: e.head, body: e.body,
        btn: e.btn, btnHref: e.btnHref,
        hasPs: !!e.hasPs, ps: e.ps || "",
        hasBalance: !!e.hasBalance, balance: e.balance || "",
        legal: e.legal,
      })),
    };
  }
}
</script>
</body>
</html>
