[build]
  publish = "."

# Clean URL: /halo -> halo.html (canonical is /halo)
[[redirects]]
  from = "/halo"
  to = "/halo.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
