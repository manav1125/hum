<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- viewport-fit=cover is required for iOS WKWebView to expose env(safe-area-inset-*);
       without it the Capacitor shell renders under the notch / home indicator.
       user-scalable=no + maximum-scale=1 disable pinch-zoom and the double-tap
       zoom that make a web view feel un-native; content scrolls but never scales. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1A2230" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#EAEDF2" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <!-- Cue brand type: DM Sans (UI) + DM Mono (eyebrows/timestamps/pills). The
       app references these families inline throughout; without loading them they
       fall back to system-ui. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=DM+Mono:wght@400;500&display=swap" />
  <title>Cue</title>
  <script src="/theme-init.js"></script>
</head>
<body>
  <div id="root"></div>
  <!-- Branded ink boot splash; self-removes when React renders (covers the
       SPA-load gap on a cold backend so the WKWebView never flashes white). -->
  <script src="/boot-splash.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
