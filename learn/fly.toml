# Cue Learn sidecar — private service, reached ONLY from the Cue gateway's
# /learn proxy over Fly private networking (no public IPs are allocated to
# this app; do not add them — the app itself has no user auth beyond the
# optional ACCESS_CODE, the Cue gateway's learn-session cookie is the gate).
app = "cue-learn-manav"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  OPENMAIC_BASE_PATH = "/learn"
  OPENMAIC_FIXED_OWNER_ID = "cue-owner"
  NEXT_PUBLIC_PERSISTENCE = "1"
  # NEXT_PUBLIC_PERSISTENCE_TOKEN is passed as --build-arg at deploy time
  # (see ~/.cue/learn-persistence-token) so it never lands in git. It is
  # compiled into the client bundle by design — the bundle itself is only
  # reachable through the gateway's learn-session cookie, which is the real
  # gate on this single-user deployment.
  NEXT_PUBLIC_PRO_WORKBENCH_ENABLED = "true"

[env]
  HOSTNAME = "::"
  OPENMAIC_BASE_PATH = "/learn"
  OPENMAIC_FIXED_OWNER_ID = "cue-owner"
  DEFAULT_MODEL = "google:gemini-3-flash-preview"
  PARALLEL_SCENE_CONCURRENCY = "3"
  NEXT_PUBLIC_PRO_WORKBENCH_ENABLED = "true"
  OPENMAIC_AGENT_RUNTIME_ENABLED = "true"
  MODEL_ROUTES = '{"maic-agent-driver":{"model":"openrouter:deepseek/deepseek-v4-pro","api":"openai-completions"}}' 

# No [[services]] / [http_service]: nothing is exposed through fly-proxy.
# The gateway dials the machine directly at cue-learn-manav.internal:3000,
# which requires the machine to stay running (no autostop).

[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"

# Classroom JSON + generated media (slides, audio) live under /app/data —
# without a volume every deploy wiped them (Postgres holds the course DSL,
# but the media files and provenance/source maps were ephemeral).
[[mounts]]
  source = "learn_data"
  destination = "/app/data"
