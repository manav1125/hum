# Cue — Render Blueprint (single-tenant). Mirrors deploy/docker-compose.yml.
#
# Topology: `cue-app` (daemon + gateway co-located in one container) is the only
# public web service; `cue-ces` and `cue-qdrant` are private services reachable
# by service name over Render's private network. The gateway↔daemon link is a
# Unix socket in the shared /workspace, which is why they share a container.
# CES keeps its security volume hard-isolated — no other service mounts it.
#
# Secrets: inter-service tokens are auto-generated + shared via the
# `cue-shared-tokens` group (generateValue). Provider/channel secrets live in
# `cue-secrets` as sync:false — set their values in the Render dashboard, do
# NOT put them here. (Per the security model, I scaffold placeholders; you
# enter the real values yourself.)
#
# Render constraints baked in: one persistent disk per service; pinned to a
# single instance (correct for single-tenant). Pick ONE region for all
# services so the private network + name DNS works.
#
# Caveat: the assistant's sandboxed skill/bash execution uses bubblewrap,
# which needs user-namespaces Render's container platform may not grant — the
# daemon boots in degraded mode (sandboxing off) if so. Validate post-deploy.

envVarGroups:
  - name: cue-shared-tokens
    envVars:
      # Generated once by Render, shared across every service that references
      # this group — this is how gateway↔assistant↔CES authenticate.
      - key: CES_SERVICE_TOKEN
        generateValue: true
      - key: ASSISTANT_API_KEY
        generateValue: true
      - key: GATEWAY_JWT
        generateValue: true

  - name: cue-secrets
    envVars:
      # The brain runs on Claude Fable 5 (per CUE-INFRA-SPEC). Set in dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional inbound channels — leave blank until you wire them.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Outbound allowlist for CES secure commands.
      - key: PROXY_ALLOWED_HOSTS
        value: "*"

services:
  # ── vector store (private) ─────────────────────────────────────────────
  - type: pserv
    name: cue-qdrant
    runtime: image
    image:
      url: docker.io/qdrant/qdrant:v1.12.4
    region: singapore
    plan: starter
    disk:
      name: qdrant
      mountPath: /qdrant/storage
      sizeGB: 5

  # ── credential execution service (private, hard-isolated) ──────────────
  - type: pserv
    name: cue-ces
    runtime: docker
    dockerfilePath: ./credential-executor/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    disk:
      # The security volume. CES is the ONLY service that mounts it.
      name: ces-security
      mountPath: /ces-security
      sizeGB: 5
    envVars:
      - fromGroup: cue-shared-tokens
      - fromGroup: cue-secrets
      - key: CES_MODE
        value: managed
      - key: CES_HEALTH_PORT
        value: "8090"
      # One-disk-per-service: keep CES data on the same persistent disk.
      - key: CES_PRIVATE_DATA_DIR
        value: /ces-security/data

  # ── cue-app: daemon + gateway, co-located (the ONLY public ingress) ─────
  # The gateway reaches the daemon over the Unix socket in the shared
  # /workspace, so they MUST run in one container (Render can't share a socket
  # across services). The combined start command runs both (see
  # assistant/docker-cue-app-entrypoint.sh). Public traffic hits the gateway on
  # Render's $PORT (10000); the daemon binds 127.0.0.1:3001 in-container only.
  - type: web
    name: cue-app
    runtime: docker
    dockerfilePath: ./assistant/Dockerfile
    dockerContext: .
    dockerCommand: /app/assistant/docker-cue-app-entrypoint.sh
    region: singapore
    plan: standard # daemon + gateway + tools; size up as needed
    healthCheckPath: /healthz
    disk:
      name: workspace # SQLite + 8-type memory + workspace files + gateway keys
      mountPath: /workspace
      sizeGB: 10
    envVars:
      - fromGroup: cue-shared-tokens
      - fromGroup: cue-secrets
      - key: IS_CONTAINERIZED
        value: "true"
      - key: VELLUM_ENVIRONMENT
        value: production
      - key: VELLUM_WORKSPACE_DIR
        value: /workspace
      # daemon HTTP — in-container only (gateway reaches it via socket + this)
      - key: RUNTIME_HTTP_HOST
        value: 127.0.0.1
      - key: RUNTIME_HTTP_PORT
        value: "3001"
      - key: RUNTIME_PROXY_REQUIRE_AUTH
        value: "true"
      # gateway — public on Render's $PORT
      - key: GATEWAY_PORT
        value: "10000"
      - key: GATEWAY_INTERNAL_URL
        value: http://127.0.0.1:10000
      - key: GATEWAY_SECURITY_DIR
        value: /workspace/gateway-security
      - key: ASSISTANT_HOST
        value: 127.0.0.1
      - key: DEFAULT_ASSISTANT_ID
        value: cue-local
      - key: VELLUM_ASSISTANT_NAME
        value: Cue
      # external services (HTTP)
      - key: QDRANT_URL
        value: http://cue-qdrant:6333
      - key: CES_CREDENTIAL_URL
        value: http://cue-ces:8090
      - key: CUE_BRAIN_MODEL
        value: claude-fable-5
