# Cue HQ on Fly — control plane + public site. Deploy from REPO ROOT:
#   flyctl deploy --config hq/fly.toml .
# (build.dockerfile below is resolved relative to this file's directory,
#  the build CONTEXT is the cwd — must be the repo root so site/ is included)
app = "cue-hq"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = false   # the control plane answers webhooks + serves the site — always on
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
